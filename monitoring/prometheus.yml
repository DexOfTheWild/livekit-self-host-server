global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: token-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:3000

  - job_name: livekit
    static_configs:
      - targets:
          - 127.0.0.1:6789

  - job_name: coturn
    static_configs:
      - targets:
          - 127.0.0.1:9641

  - job_name: node
    static_configs:
      - targets:
          - 127.0.0.1:9100

  - job_name: redis
    static_configs:
      - targets:
          - 127.0.0.1:9121
